<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TWEVIX CARE™ by Twevix™ | HealthTech, Healthcare HR &amp; Clinical Training</title>
  <link rel="icon" type="image/png" href="twevixcare-logo.png" />
  <meta name="description" content="TWEVIX CARE™ by Twevix™ unifies clinical decision-intelligence software, healthcare HR workforce optimization, and applied clinical data training." />
  <style>
    :root {
      --bg-midnight: #05111e;
      --bg-navy-card: #0b1d32;
      --bg-navy-elevated: #102844;
      --emerald-bright: #10b981;
      --emerald-glow: #34d399;
      --emerald-dark: #059669;
      --teal-logo: #0d9488;
      --amber-gold: #f59e0b;
      --amber-dark: #d97706;
      --text-white: #f8fafc;
      --text-slate: #cbd5e1;
      --text-muted: #94a3b8;
      --border-glow: rgba(16, 185, 129, 0.3);
      --border-subtle: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background-color: var(--bg-midnight);
      color: var(--text-white);
      line-height: 1.65;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes pulseDot {
      0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
      100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }
    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Navigation */
    header {
      background: rgba(5, 17, 30, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 1rem 4%;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-inner {
      max-width: 1360px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .brand { display: flex; align-items: center; gap: 0.85rem; }
    .brand img {
      height: 46px;
      width: 46px;
      border-radius: 50%;
      border: 1.5px solid var(--emerald-bright);
    }
    .brand-name { font-size: 1.35rem; font-weight: 850; letter-spacing: -0.02em; }
    .brand-name span { color: var(--emerald-glow); }
    .brand-sub { font-size: 0.78rem; color: var(--text-muted); }

    nav { display: flex; gap: 1.65rem; align-items: center; font-size: 0.94rem; font-weight: 600; }
    nav a { color: var(--text-slate); transition: color 0.2s; }
    nav a:hover { color: var(--emerald-glow); }
    .nav-btn {
      background: linear-gradient(135deg, var(--emerald-bright), var(--teal-logo));
      color: #ffffff !important;
      padding: 0.65rem 1.35rem;
      border-radius: 999px;
      box-shadow: 0 4px 18px rgba(16, 185, 129, 0.35);
      transition: transform 0.2s ease;
    }
    .nav-btn:hover { transform: translateY(-2px); }

    /* Hero */
    .hero {
      background: linear-gradient(-45deg, #05111e, #082338, #061c2c, #0a2e38);
      background-size: 300% 300%;
      animation: bgShift 14s ease infinite;
      padding: 5.25rem 4% 5.5rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .hero-grid {
      max-width: 1360px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.2fr 0.85fr;
      gap: 3.5rem;
      align-items: center;
    }
    @media (max-width: 960px) {
      .hero-grid { grid-template-columns: 1fr; gap: 2.5rem; }
    }
    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid var(--border-glow);
      color: var(--emerald-glow);
      padding: 0.4rem 1.1rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 1.3rem;
    }
    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald-glow);
      animation: pulseDot 1.8s infinite;
    }
    .hero h1 {
      font-size: clamp(2.25rem, 4.2vw, 3.55rem);
      font-weight: 850;
      line-height: 1.14;
      margin-bottom: 1.3rem;
    }
    .hero h1 span { color: var(--emerald-glow); display: block; }
    .hero p {
      font-size: 1.12rem;
      color: var(--text-slate);
      margin-bottom: 2.2rem;
      max-width: 680px;
    }
    .cta-group { display: flex; gap: 1rem; flex-wrap: wrap; }
    .btn {
      padding: 0.95rem 1.7rem;
      border-radius: 0.65rem;
      font-weight: 700;
      font-size: 0.98rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.22s ease;
    }
    .btn:hover { transform: translateY(-3px); }
    .btn-emerald {
      background: linear-gradient(135deg, var(--emerald-bright), var(--emerald-dark));
      color: #ffffff;
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.35);
    }
    .btn-amber {
      background: linear-gradient(135deg, var(--amber-gold), var(--amber-dark));
      color: #05111e;
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.3);
    }
    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-white);
      border: 1px solid var(--border-subtle);
    }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.12); border-color: var(--emerald-glow); }

    /* Floating Clinical Command Card */
    .command-card {
      background: rgba(11, 29, 50, 0.92);
      border: 1.5px solid var(--border-glow);
      border-radius: 1.35rem;
      padding: 2.2rem;
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.55);
      animation: floatCard 5s ease-in-out infinite;
    }
    .card-top {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding-bottom: 1.15rem;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .card-top img { height: 64px; width: 64px; border-radius: 50%; }
    .stat-list { display: grid; gap: 0.85rem; }
    .stat-item {
      background: var(--bg-navy-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 0.8rem;
      padding: 0.9rem 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stat-item span { font-size: 0.9rem; color: var(--text-slate); font-weight: 600; }
    .stat-item strong { font-size: 0.95rem; color: var(--emerald-glow); }

    /* Sections */
    .section { max-width: 1360px; margin: 0 auto; padding: 5rem 4%; }
    .section-head { text-align: center; max-width: 780px; margin: 0 auto 3.5rem; }
    .sec-tag {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--emerald-glow);
      margin-bottom: 0.5rem;
    }
    .section-head h2 { font-size: 2.35rem; font-weight: 850; margin-bottom: 0.75rem; }
    .section-head p { color: var(--text-slate); font-size: 1.08rem; }

    /* 3-Column Healthcare Pillars */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
    }
    @media (max-width: 1024px) {
      .grid-3 { grid-template-columns: 1fr; }
    }
    .pillar-card {
      background: var(--bg-navy-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: 1.2rem;
      padding: 2.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
    }
    .pillar-card:hover {
      border-color: var(--emerald-bright);
      transform: translateY(-6px);
      box-shadow: 0 18px 40px rgba(16, 185, 129, 0.16);
    }
    .col-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.28rem 0.8rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }
    .badge-tech { background: rgba(16, 185, 129, 0.15); color: var(--emerald-glow); border: 1px solid var(--border-glow); }
    .badge-hr { background: rgba(245, 158, 11, 0.15); color: var(--amber-gold); border: 1px solid rgba(245, 158, 11, 0.35); }
    .badge-train { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.35); }

    .pillar-card h3 { font-size: 1.45rem; margin-bottom: 0.75rem; }
    .pillar-card p { color: var(--text-slate); font-size: 0.96rem; margin-bottom: 1.35rem; }
    .bullet-list { list-style: none; margin-bottom: 1.85rem; }
    .bullet-list li {
      padding: 0.45rem 0;
      font-size: 0.93rem;
      color: var(--text-slate);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .card-btn {
      display: block;
      text-align: center;
      padding: 0.8rem 1.2rem;
      border-radius: 0.6rem;
      font-weight: 700;
      font-size: 0.94rem;
      background: var(--bg-navy-elevated);
      border: 1px solid var(--border-glow);
      color: var(--emerald-glow);
      transition: all 0.2s ease;
    }
    .card-btn:hover { background: var(--emerald-bright); color: #ffffff; }

    /* Founder Banner */
    .founder-card {
      background: linear-gradient(145deg, var(--bg-navy-card), var(--bg-navy-elevated));
      border: 1px solid var(--border-glow);
      border-radius: 1.25rem;
      padding: 2.75rem;
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 2.5rem;
      align-items: center;
    }
    @media (max-width: 900px) {
      .founder-card { grid-template-columns: 1fr; }
    }
    .creds { display: flex; flex-wrap: wrap; gap: 0.65rem; margin-top: 1.25rem; }
    .cred-pill {
      background: rgba(16, 185, 129, 0.12);
