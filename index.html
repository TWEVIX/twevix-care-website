<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TWEVIX CARE™ | Applied HealthTech + Clinical Workforce Ecosystem</title>
  <meta name="description" content="Predictive Clinical Time-Series, Multilingual Patient NLP & Safe Healthcare Staffing by TWEVIX Z LTD (UK & Rwanda)." />
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #070d19;
      --bg-secondary: #0d1629;
      --bg-card: #111d35;
      --border-subtle: rgba(148, 163, 184, 0.16);
      --border-accent: rgba(20, 184, 166, 0.45);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --teal: #14b8a6;
      --cyan: #38bdf8;
      --emerald: #10b981;
      --radius-lg: 16px;
      --radius-md: 10px;
      --radius-sm: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 0%, rgba(20, 184, 166, 0.12), transparent 35%),
        radial-gradient(circle at 85% 15%, rgba(56, 189, 248, 0.1), transparent 35%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .container {
      max-width: 1220px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.925rem;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--teal), #0d9488);
      color: #042f2e;
      box-shadow: 0 4px 20px rgba(20, 184, 166, 0.28);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 26px rgba(20, 184, 166, 0.42);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border-subtle);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .btn-outline-teal {
      background: rgba(20, 184, 166, 0.08);
      border-color: var(--border-accent);
      color: var(--teal);
    }

    .btn-outline-teal:hover {
      background: rgba(20, 184, 166, 0.16);
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 0.85rem;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 13, 25, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 74px;
      gap: 16px;
      flex-wrap: wrap;
      padding: 10px 0;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title span {
      color: var(--teal);
    }

    .brand-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 22px;
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .nav-links a:hover {
      color: var(--text-main);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hero {
      padding: 64px 0 56px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      gap: 44px;
      align-items: center;
    }

    .eyebrow-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(20, 184, 166, 0.12);
      border: 1px solid var(--border-accent);
      color: var(--teal);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(2.15rem, 3.8vw, 3.2rem);
      font-weight: 800;
      line-height: 1.14;
      letter-spacing: -0.03em;
      margin-bottom: 18px;
    }

    .hero-lead {
      font-size: 1.06rem;
      color: var(--text-muted);
      margin-bottom: 28px;
      max-width: 600px;
    }

    .hero-ctas {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 26px;
    }

    .trust-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      font-size: 0.82rem;
      color: var(--text-muted);
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
    }

    .trust-strip span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .trust-strip span::before {
      content: "•";
      color: var(--teal);
      font-weight: bold;
    }

    .trust-strip span:first-child::before {
      display: none;
    }

    .sandbox-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .sandbox-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: rgba(0, 0, 0, 0.35);
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.8rem;
    }

    .window-dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot-r { background: #ef4444; }
    .dot-y { background: #f59e0b; }
    .dot-g { background: #10b981; }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--emerald);
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
    }

    .sandbox-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid var(--border-subtle);
    }

    .tab-btn {
      padding: 14px 12px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: var(--text-main);
      background: rgba(20, 184, 166, 0.08);
      border-bottom-color: var(--teal);
    }

    .sandbox-body {
      padding: 22px;
    }

    .case-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .case-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .slider-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 16px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.86rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .slider-val {
      color: var(--teal);
      font-size: 1.05rem;
      font-weight: 800;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--teal);
      cursor: pointer;
    }

    .metrics-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .metric-tile {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px;
    }

    .metric-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--emerald);
    }

    .metric-value.cyan {
      color: var(--cyan);
    }

    .sha-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 0.78rem;
      margin-bottom: 16px;
    }

    .sha-code {
      color: #6ee7b7;
      font-weight: 600;
    }

    .sha-link {
      color: var(--teal);
      font-weight: 700;
      text-decoration: underline;
    }

    .form-select, .form-textarea, .form-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.88rem;
      margin-bottom: 12px;
    }

    .form-select:focus, .form-textarea:focus, .form-input:focus {
      outline: none;
      border-color: var(--teal);
    }

    .nlp-actions {
