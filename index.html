<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TWEVIX CARE™ by Twevix™ | HealthTech, Healthcare HR &amp; Clinical Training</title>
  <link rel="icon" type="image/png" href="twevixcare-logo.png" />
  <meta name="description" content="TWEVIX CARE™ by Twevix™ unifies clinical decision-intelligence software, healthcare HR workforce optimization, and applied clinical data training." />
  <style>
    :root {
      --bg-midnight: #05111e;
      --bg-navy-card: #0b1d32;
      --bg-navy-elevated: #102844;
      --emerald-bright: #10b981;
      --emerald-glow: #34d399;
      --emerald-dark: #059669;
      --teal-logo: #0d9488;
      --amber-gold: #f59e0b;
      --amber-dark: #d97706;
      --text-white: #f8fafc;
      --text-slate: #cbd5e1;
      --text-muted: #94a3b8;
      --border-glow: rgba(16, 185, 129, 0.3);
      --border-subtle: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background-color: var(--bg-midnight);
      color: var(--text-white);
      line-height: 1.65;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }

    /* Navigation */
    header {
      width: 100%;
      background: rgba(5, 17, 30, 0.95);
      border-bottom: 1px solid var(--border-subtle);
      padding: 1rem 4%;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-inner {
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .brand { display: flex; align-items: center; gap: 0.85rem; }
    .brand img {
      height: 46px;
      width: 46px;
      border-radius: 50%;
      border: 1.5px solid var(--emerald-bright);
    }
    .brand-name { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand-name span { color: var(--emerald-glow); }
    .brand-sub { font-size: 0.78rem; color: var(--text-muted); }

    nav { display: flex; gap: 1.6rem; align-items: center; font-size: 0.94rem; font-weight: 600; flex-wrap: wrap; }
    nav a { color: var(--text-slate); transition: color 0.2s; }
    nav a:hover { color: var(--emerald-glow); }
    .nav-btn {
      background: linear-gradient(135deg, var(--emerald-bright), var(--teal-logo));
      color: #ffffff !important;
      padding: 0.65rem 1.35rem;
      border-radius: 999px;
      box-shadow: 0 4px 18px rgba(16, 185, 129, 0.35);
    }

    /* Hero */
    .hero {
      width: 100%;
      background: radial-gradient(circle at top right, rgba(13, 148, 136, 0.28) 0%, var(--bg-midnight) 60%);
      padding: 4.5rem 4% 5rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .hero-grid {
      max-width: 1320px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.2fr 0.85fr;
      gap: 3rem;
      align-items: center;
    }
    @media (max-width: 960px) {
      .hero-grid { grid-template-columns: 1fr; gap: 2.25rem; }
    }
    .kicker {
      display: inline-block;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid var(--border-glow);
      color: var(--emerald-glow);
      padding: 0.4rem 1.1rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }
    .hero h1 {
      font-size: clamp(2.2rem, 4vw, 3.4rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 1.25rem;
    }
    .hero h1 span { color: var(--emerald-glow); display: block; }
    .hero p {
      font-size: 1.1rem;
      color: var(--text-slate);
      margin-bottom: 2rem;
      max-width: 660px;
    }
    .cta-group { display: flex; gap: 0.9rem; flex-wrap: wrap; }
    .btn {
      padding: 0.9rem 1.6rem;
      border-radius: 0.65rem;
      font-weight: 700;
      font-size: 0.96rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: transform 0.2s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-emerald {
      background: linear-gradient(135deg, var(--emerald-bright), var(--emerald-dark));
      color: #ffffff;
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.35);
    }
    .btn-amber {
      background: linear-gradient(135deg, var(--amber-gold), var(--amber-dark));
      color: #05111e;
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.3);
    }
    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-white);
      border: 1px solid var(--border-subtle);
    }

    /* Clinical Command Card */
    .command-card {
      background: var(--bg-navy-card);
      border: 1.5px solid var(--border-glow);
      border-radius: 1.35rem;
      padding: 2rem;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.5);
    }
    .card-top {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding-bottom: 1.1rem;
      margin-bottom: 1.2rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .card-top img { height: 60px; width: 60px; border-radius: 50%; }
    .stat-list { display: grid; gap: 0.8rem; }
    .stat-item {
      background: var(--bg-navy-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 0.8rem;
      padding: 0.85rem 1.05rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .stat-item span { font-size: 0.9rem; color: var(--text-slate); font-weight: 600; }
    .stat-item strong { font-size: 0.92rem; color: var(--emerald-glow); }

    /* Sections */
    .section {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      padding: 4.75rem 4%;
    }
    .section-head { text-align: center; max-width: 760px; margin: 0 auto 3.25rem; }
    .sec-tag {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--emerald-glow);
      margin-bottom: 0.5rem;
    }
    .section-head h2 { font-size: 2.25rem; font-weight: 800; margin-bottom: 0.75rem; }
    .section-head p { color: var(--text-slate); font-size: 1.05rem; }

    /* 3-Column Healthcare Pillars */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.85rem;
    }
    @media (max-width: 1024px) {
      .grid-3 { grid-template-columns: 1fr; }
    }
    .pillar-card {
      background: var(--bg-navy-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: 1.2rem;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .pillar-card:hover {
      border-color: var(--emerald-bright);
      transform: translateY(-4px);
    }
    .col-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.28rem 0.8rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }
    .badge-tech { background: rgba(16, 185, 129, 0.15); color: var(--emerald-glow); border: 1px solid var(--border-glow); }
    .badge-hr { background: rgba(245, 158, 11, 0.15); color: var(--amber-gold); border: 1px solid rgba(245, 158, 11, 0.35); }
    .badge-train { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.35); }

    .pillar-card h3 { font-size: 1.38rem; margin-bottom: 0.75rem; }
    .pillar-card p { color: var(--text-slate); font-size: 0.95rem; margin-bottom: 1.3rem; }
    .bullet-list { list-style: none; margin-bottom: 1.75rem; }
    .bullet-list li {
      padding: 0.45rem 0;
      font-size: 0.92rem;
      color: var(--text-slate);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .card-btn {
      display: block;
      text-align: center;
      padding: 0.85rem 1.2rem;
      border-radius: 0.6rem;
      font-weight: 700;
      font-size: 0.94rem;
      background: var(--bg-navy-elevated);
      border: 1px solid var(--border-glow);
      color: var(--emerald-glow);
      transition: all 0.2s ease;
    }
    .card-btn:hover { background: var(--emerald-bright); color: #ffffff; }

    /* Founder Banner */
    .founder-card {
      background: linear-gradient(145deg, var(--bg-navy-card), var(--bg-navy-elevated));
      border: 1px solid var(--border-glow);
      border-radius: 1.25rem;
      padding: 2.5rem;
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 2.25rem;
      align-items: center;
    }
    @media (max-width: 900px) {
      .founder-card { grid-template-columns: 1fr; }
    }
    .creds { display: flex; flex-wrap: wrap; gap: 0.65rem; margin-top: 1.25rem; }
    .cred-pill {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid var(--border-glow);
      padding: 0.4rem 0.85rem;
      border-radius: 0.5rem;
      font-size: 0.84rem;
      color: var(--emerald-glow);
      font-weight: 600;
    }

    /* Footer */
    footer {
      width: 100%;
      background: #030a12;
      border-top: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 2.75rem 4%;
      text-align: center;
      font-size: 0.92rem;
    }
    footer a { color: var(--emerald-glow); font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <div class="nav-inner">
      <div class="brand">
        <img src="twevixcare-logo.png" alt="TWEVIX CARE Logo" />
        <div>
          <div class="brand-name">TWEVIX <span>CARE™</span></div>
          <div class="brand-sub">By <strong style="color:var(--text-white);">Twevix™</strong> | HealthTech • Healthcare HR • Clinical Training</div>
        </div>
      </div>
      <nav>
        <a href="#pillars">3 Core Pillars</a>
